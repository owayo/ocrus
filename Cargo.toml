[workspace]
members = [
    "crates/ocrus-core",
    "crates/ocrus-preproc",
    "crates/ocrus-layout",
    "crates/ocrus-recognizer",
    "crates/ocrus-engine",
    "crates/ocrus-cli",
    "crates/ocrus-python",
    "crates/ocrus-dataset",
    "crates/ocrus-nn",
]
resolver = "3"

[package]
name = "ocrus-bench"
version.workspace = true
edition.workspace = true
publish = false
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.project-standard]
readme-languages = ["ja"]

[dev-dependencies]
criterion = { workspace = true }
ocrus-preproc = { workspace = true }
ocrus-layout = { workspace = true }
ocrus-recognizer = { workspace = true }
image = { workspace = true }
ndarray = { workspace = true }

[[bench]]
name = "preproc"
harness = false

[workspace.package]
description = "純 Rust の推論エンジンと CLI・Python バインディングを備えた日本語 OCR"
rust-version = "1.99"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/owayo/ocrus"

[workspace.dependencies]
ocrus-core = { path = "crates/ocrus-core" }
ocrus-preproc = { path = "crates/ocrus-preproc" }
ocrus-layout = { path = "crates/ocrus-layout" }
ocrus-recognizer = { path = "crates/ocrus-recognizer" }
ocrus-engine = { path = "crates/ocrus-engine" }
ocrus-dataset = { path = "crates/ocrus-dataset" }
ocrus-nn = { path = "crates/ocrus-nn" }

# フォント描画・データ拡張
ab_glyph = "0.2.32"
ttf-parser = "0.25.1"
imageproc = "0.27.0"
rand = "0.10.2"

# シリアライズ
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# エラー処理
thiserror = "2.0.20"
anyhow = "1.0.104"

# 画像処理
image = "0.25.10"
ndarray = "0.17.2"

# 並列処理
rayon = "1.12.0"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# ベンチマーク
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
