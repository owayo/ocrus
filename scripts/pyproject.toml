[project]
name = "ocrus-scripts"
version = "0.1.0"
description = "Test data generation scripts for ocrus OCR engine"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
convert = ["numpy", "onnx", "onnxruntime>=1.30.0"]
train = [
    "paddlepaddle-gpu>=3.3.0",
    "paddlex>=3.7.2",
    "paddle2onnx>=2.1.0",
    "onnx",
    "pyyaml",
    "requests",
    "tqdm",
    "lmdb",
    "pyclipper",
    "rapidfuzz",
    "albumentations",
    "imgaug",
    "onnx_graphsurgeon",
]
quantize = ["onnxruntime>=1.30.0"]

[project.scripts]
generate-test-chars = "ocrus_scripts.generate_test_chars:main"
finetune = "ocrus_scripts.finetune:main"
export-onnx = "ocrus_scripts.export_onnx:main"
export-inference = "ocrus_scripts.export_inference:main"
checkpoint-to-onnx = "ocrus_scripts.checkpoint_to_onnx:main"
quantize = "ocrus_scripts.quantize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrus_scripts"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "paddle-cuda"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
# この配布元には公開日時がないため、日時による除外は他の配布元だけに適用する。
exclude-newer = false
