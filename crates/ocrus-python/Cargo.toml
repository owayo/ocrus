[package]
name = "ocrus-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ocrus_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
ocrus-core = { workspace = true }
ocrus-engine = { workspace = true }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde_json = { workspace = true }

[features]
# maturin enables this when building a wheel (see [tool.maturin] features in pyproject.toml).
# It must stay out of the default set: with extension-module on, the crate does not link
# against libpython, so `cargo build/test --workspace` would fail on Linux and macOS.
extension-module = ["pyo3/extension-module"]
